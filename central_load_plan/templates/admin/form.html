{% extends "admin/base.html" %}


{% from "render.html" import render_form2 %}


{% block main %}
    {{ super() }}
    {% if form.__doc__ %}<h3>{{ form.__doc__ }}</h3>{% endif %}
    <p>{{ model.__doc__ }}</p>
    <form action="{{ url_for(request.endpoint, **request.view_args) }}" method="POST">
        {{ render_form2(form)}}
    </form>
{% endblock main %}
